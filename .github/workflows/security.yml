# Checks the security of the workflows and the npm packages.
# - zizmor finds unsafe patterns in .github/workflows (secrets, permissions, injection, cache).
# - npm audit finds known vulnerabilities in package-lock.json. It fails on high or critical.
# It runs by hand (Actions → Security audit → Run workflow) and when the workflows or the lockfile change.
name: Security audit

on:
  workflow_dispatch:
  pull_request:
    paths: ['.github/**', 'package-lock.json']
  push:
    branches: [main]
    paths: ['.github/**', 'package-lock.json']

permissions: {}

jobs:
  workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false

  packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # npm audit reads only package-lock.json, so it does not run package code.
      - run: npm audit --audit-level=high
